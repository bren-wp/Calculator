name: Android
on:
  pull_request:
  push:
    branches: [main, feature/native-calculator-app]
  workflow_dispatch:
concurrency:
  group: calculator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build, unit test and lint
        env:
          CALCULATOR_BUILD_NUMBER: ${{ github.run_number }}
          CALCULATOR_BUILD_NAME: "1.1.0-debug.${{ github.run_number }}"
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleDebug :app:bundleRelease :app:assembleRelease
      - name: Package source and checksums
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Calculator-debug.apk
          cp app/build/outputs/bundle/debug/app-debug.aab dist/Calculator-debug.aab
          cp app/build/outputs/bundle/release/app-release.aab dist/Calculator-release-UNSIGNED.aab
          git archive --format=zip --output=dist/Calculator-source.zip HEAD
          (cd dist && sha256sum Calculator-* > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Calculator-v1.1.0-build-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Calculator-v1.1.0-build-${{ github.run_number }}
          path: dist
      - name: Publish tagged preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v1.1.0-debug.${{ github.run_number }}
        run: |
          cat > notes.md <<'NOTES'
          Calculator preview release

          Includes an installable debug APK, debug AAB, unsigned release AAB, complete source ZIP, and checksums.
          This is a development release. The debug signature and unsigned release AAB are NOT suitable for production Play upload.
          Google Play production upload requires a private, securely configured upload-signing key and Play Console checks.
          NOTES
          gh release create "$TAG" dist/Calculator-debug.apk dist/Calculator-debug.aab dist/Calculator-release-UNSIGNED.aab dist/Calculator-source.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Calculator $TAG" --notes-file notes.md --prerelease
