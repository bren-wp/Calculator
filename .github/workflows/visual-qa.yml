name: Visual QA
on:
  pull_request:
    paths:
      - 'app/src/**'
      - 'branding/screens/**'
      - 'scripts/**'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Install platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile app
        run: gradle --no-daemon :app:assembleDebug
      - name: Capture live screen renders
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/capture-screens.sh
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Compare against original Calculator branding
        run: |
          python -m pip install --disable-pip-version-check Pillow cairosvg
          python scripts/compare-screens.py
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-screen-parity-report
          path: visual-qa/
          if-no-files-found: error
